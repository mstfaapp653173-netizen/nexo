header.top{display:flex;justify-content:space-between;align-items:center;gap:.75rem 1.5rem;flex-wrap:wrap;padding:1.1rem 0;position:relative;z-index:2}
.brand{display:block;text-decoration:none;direction:ltr}
.right{display:flex;align-items:center;gap:1.25rem 1.5rem;flex-wrap:wrap}
nav{display:flex;gap:1.25rem;flex-wrap:wrap}
nav a{color:var(--gray);text-decoration:none;font-size:.95rem}
nav a:hover{color:var(--white);text-decoration:underline;text-decoration-color:var(--cyan);text-underline-offset:6px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;border:0;background:transparent;color:var(--gray);padding:.25rem .9rem;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--blue);color:var(--white);box-shadow:var(--glow-blue)}

.hero{position:relative;overflow:hidden;background:radial-gradient(60% 70% at 85% 45%,rgba(0,102,255,.20),transparent 70%),radial-gradient(40% 50% at 95% 85%,rgba(123,44,255,.14),transparent 70%),var(--navy-deep)}
.hero .wrap{position:relative;z-index:1;padding-top:4rem;padding-bottom:7rem}
.hero h1{margin:0 0 1.25rem;font-size:clamp(2.4rem,8.5vw,4.8rem);line-height:1.3;font-weight:700;max-width:15ch;color:var(--white)}
html:lang(en) .hero h1{line-height:1.1;max-width:12ch;font-weight:800}
.hero p.lead{margin:0 0 2rem;max-width:34rem;color:var(--gray);font-size:1.1rem}
.btns{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.8rem 1.6rem;border-radius:10px;background:var(--blue);color:var(--white);text-decoration:none;font-weight:600;box-shadow:var(--glow-blue)}
.btn:hover{background:var(--g-bc)}
.btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:transparent;border-color:var(--cyan);box-shadow:var(--glow-cyan)}
.waves{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(110%,62rem);height:100%;z-index:0;pointer-events:none;opacity:.7}
html[dir="rtl"] .waves{transform:scaleX(-1)}

section{position:relative;isolation:isolate;padding:4rem 0;border-top:1px solid var(--line)}
section.alt::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:var(--navy);z-index:-1}
section h2{margin:0 0 2rem;font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.4;font-weight:700;color:var(--white)}
.about p{max-width:44rem;margin:0;font-size:1.2rem;line-height:1.95;color:var(--gray)}
.rows{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:1rem}
.rows li{padding:1.25rem 1.4rem;background:var(--navy);border:1px solid var(--line);border-inline-start:3px solid var(--cyan);border-radius:14px;font-size:1.15rem;font-weight:500;color:var(--white)}
.rows li::before{content:"";display:block;width:.6rem;height:.6rem;margin-bottom:.8rem;background:var(--g-cp);transform:rotate(45deg)}
.rows li:hover{box-shadow:var(--glow-cyan)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.75rem}
.chips li{padding:.55rem 1.25rem;background:var(--navy-deep);border:1px solid var(--line);border-radius:999px;color:var(--white)}
.cta{background:radial-gradient(50% 90% at 50% 100%,rgba(0,102,255,.20),transparent 70%),var(--navy-deep)}
.cta h2{max-width:34rem}
footer{padding:2rem 0 3rem;color:var(--gray);font-size:.9rem;background:var(--navy);border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
footer .logo{height:2.2rem}

@media (min-width:760px){.rows{grid-template-columns:1fr 1fr}}
@media (min-width:1020px){.rows{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
